# Konfiguracja miejsca zapisu dokumentów agenta na SharePoint (Microsoft
# Graph, integrations.yaml wpis `microsoft_365`). Nie-sekret — sam adres
# witryny, nie token. Sekrety (MS_GRAPH_CLIENT_ID/SECRET/TENANT_ID) w
# secrets/.env, współdzielone z microsoft_graph_mail_client.py.

site_host: odczarujlowcode.sharepoint.com
site_path: /sites/Wirtualny-pracownik
library: "Dokumenty"

# Folder główny dla wszystkich dokumentów wygenerowanych przez agenta —
# jeden podfolder per zadanie (data + skrócony tytuł), żeby łatwo
# odróżnić deliverable od reszty zawartości biblioteki.
root_folder: "Zadania-Agenta"

# --- Odczyt INNYCH witryn SharePoint tej samej organizacji ---
# Decyzja właściciela 29.08.2026: każdy agent/subagent ma mieć ODCZYT (NIGDY
# zapis) do witryn firmowego SharePoint zarejestrowanych w
# config/sharepoint_sites.yaml (allowlist — witryny z POTWIERDZONYM dostępem
# aplikacji Graph, zweryfikowane na żywo 29.08.2026: Wirtualny-pracownik,
# Organizacja, ProjektyRaportowania, AplikacjeClaude, SprzedazMarketing,
# Administracja), z WYJĄTKIEM listy wykluczeń poniżej ("Zarządcze" —
# potwierdzone przez właściciela 29.08.2026, dane zarządu NIE są dla botów).
# Zapis (upload_file/ensure_folder) zostaje ograniczony WYŁĄCZNIE do site_path
# powyżej (Wirtualny-pracownik) — ta sekcja i sharepoint_sites.yaml dotyczą
# TYLKO odczytu (sharepoint_reader.py + sharepoint_client.read_text/list_children).
#
# Ta lista jest DODATKOWĄ warstwą (defense-in-depth) NIEZALEŻNĄ od rejestru w
# sharepoint_sites.yaml — nawet gdyby ktoś kiedyś dopisał zakazaną witrynę do
# tamtego rejestru przez pomyłkę, ta lista i tak zablokuje odczyt.
read_access:
  denied_site_paths:
    - "/sites/Zarzadcze"
    - "/sites/Zarządcze"
