# Rejestr dostępnych integracji/kont — SKALOWANIE.md sekcja 2, "konfiguracja
# firmy". Jeden plik na wszystko, co jest realnie dostępne, żeby nie szukać
# tego po całym repo. Uzupełniaj access/notes, gdy dostęp zostanie
# potwierdzony/rozszerzony. Klucze i tokeny NIGDY tutaj — tylko referencja,
# że dane konto istnieje (same sekrety w lokalnym magazynie/.env).

integrations:
  microsoft_365:
    mechanism: "konto Microsoft 365 (już założone)"
    access: "mail: read+send z jednego wspólnego konta"
    notes: "Aplikacje Microsoft (Graph itd.) dostępne — do wykorzystania przez e-mail (przychodzący/wychodzący), SharePoint, OneDrive."

  google_workspace:
    mechanism: "konto Google (już założone)"
    access: "do potwierdzenia dokładny zakres (Docs/Sheets/Search Console/Analytics — PLAN-WDROZENIA.md sekcja 6/18)"
    notes: ""

  zoho_crm:
    mechanism: "MCP"
    access: "read+write (do potwierdzenia dokładne uprawnienia po stronie MCP)"

  projectly:
    mechanism: "MCP"
    access: "read+write"
    notes: "Główny kanał komunikacji, PLAN-WDROZENIA.md sekcja 2."

  zanfia_courses:
    mechanism: "MCP"
    access: "unknown — do potwierdzenia dokładne uprawnienia po stronie MCP"
    notes: "zanfia.com — platforma do sprzedaży kursów online. Potwierdzone (nie literówka)."

  github:
    mechanism: "repozytoria Git"
    access: "read+write"
    notes: "Strony internetowe trzymane jako projekty na GitHub."

  onedrive:
    mechanism: "lokalny sync"
    access: "read+write"
    notes: "Lokalna kopia projektów stron (te same repo co GitHub) i biblioteka skilli (ZESPOL-BOTOW.md sekcja 4)."

  miro:
    mechanism: "connector"
    access: "read-only"

  tiktok_ads:
    mechanism: "API (do potwierdzenia dokładny mechanizm/uprawnienia konta)"
    access: "budżet/publikacja = czerwone jak Meta Ads (PLAN-WDROZENIA.md sekcja 6), odczyt statusu kampanii = zielone"
    notes: "Drugi kanał reklamowy obok Meta Ads — ad_spend_report_builder.py (sekcja 18) obejmuje teraz oba."

  mailerlite:
    mechanism: "REST API (developers.mailerlite.com)"
    access: >
      Kampanie: PEŁNY zapis potwierdzony — tworzenie (draft), harmonogram,
      wysyłka, anulowanie, pobieranie statystyk (otwarcia/kliknięcia/
      rezygnacje/odbicia). Subskrybenci/grupy/pola: pełny zapis, w tym
      wprowadzanie subskrybenta do już istniejącej automatyzacji przez
      grupę/pole/trigger. Automatyzacje (sama struktura kroków/triggerów):
      PRAWDOPODOBNIE budowane raz w edytorze UI MailerLite, nie generowane
      od zera przez API — niepotwierdzone w 100% (brak dostępu do pełnej
      dokumentacji z tej sesji), zweryfikuj na koncie przed poleganiem na tym.
    notes: >
      Wzorzec analogiczny do PBIP: automatyzację buduje się raz ręcznie
      (jak "warsztat" — ZESPOL-BOTOW.md sekcja 4), a bot zarządza danymi
      wjeżdżającymi w nią (subskrybenci/pola) i czyta wyniki przez API.
      Wysyłka masowa i tak jest `red` w approval_policy.yaml niezależnie
      od możliwości API — to nie zmienia zasad bezpieczeństwa, tylko
      zakres tego, co bot może przygotować/przeanalizować samodzielnie.

  hermes_local_llm:
    mechanism: "lokalny model (np. przez Ollama, http://localhost:11434)"
    access: "n/a — nie jest to konto/API zewnętrzne, tylko proces na tej samej maszynie"
    notes: >
      Założenie robocze: 'Hermes' to lokalnie hostowany model open-source,
      używany jako tania/szybka druga opinia w validator_prompt.py, nie
      zamiennik głównego modelu (Anthropic API) do planowania/wykonania.
      Do potwierdzenia z użytkownikiem, jeśli chodziło o coś innego.
