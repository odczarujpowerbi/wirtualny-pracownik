# SZABLON harmonogramu (SLEDZONY w gicie). NIE jest czytany bezposrednio w runtime.
# job_scheduler.py przy pierwszym uruchomieniu kopiuje go do config/schedule.yaml
# (plik LOKALNY, poza gitem), a przy kolejnych uruchomieniach DOMERGOWUJE stad
# nowe joby (po nazwie) do lokalnego pliku - bez kasowania lokalnych przelacznikow
# (enabled/interval zmienianych z dashboardu/CLI).
#
# DLACZEGO tak: schedule.yaml jest zapisywany w runtime (dashboard "Zapisz",
# --enable/--disable/--set-interval). Gdyby byl sledzony w gicie, kazdy `git pull`
# konfliktowalby z lokalna zmiana. Rozdzial: SZABLON w gicie, LIVE lokalnie.
#
# Chcesz dodac nowy cykliczny skrypt do dystrybucji? Dopisz go TUTAJ (i zrob commit)
# - trafi na wszystkie maszyny przy najblizszym uruchomieniu, bez konfliktow.
#
# max_duration_seconds (opcjonalne, domyslnie 1800 = 30 min, job_scheduler.
# DEFAULT_MAX_DURATION_SECONDS): watchdog - jesli wątek joba zyje dluzej niz
# ten limit, scheduler uznaje go za zawieszony i odpala nowy przebieg mimo
# ze stary "wciaz zyje" (druga linia obrony po naprawie total-timeoutu w
# mcp_client.py, zywy incydent 25.08.2026). Podwyzsz dla jobow, ktore legalnie
# potrzebuja wiecej czasu (runner_loop moze przetwarzac zadania agentic_worker
# do 600s KAZDE, do 5 na przebieg - patrz runner_loop.MAX_TASKS_PER_RUN).

jobs:
- name: runner_loop
  description: Główna pętla agenta - pobiera zadania z kolejki, klasyfikuje ryzyko,
    routuje do klienta, waliduje lub eskaluje.
  module: runner_loop
  function: run_once
  interval_seconds: 30
  max_duration_seconds: 3600
  enabled: true
- name: system_health_monitor
  description: Kontrola zdrowia maszyny - zużycie RAM i czy oczekiwane skrypty faktycznie
    działają; eskaluje przy problemie.
  module: system_health_monitor
  function: run_health_check
  interval_seconds: 120
  enabled: true
- name: machine_status_reporter
  description: Cogodzinny raport statusu maszyny (wersje narzędzi, historia bootstrapu,
    RAM) wysyłany do Projectly.
  module: machine_status_reporter
  function: run_machine_status_report
  interval_seconds: 3600
  enabled: true
- name: cost_tracker
  description: Pilnuje dziennego kosztu API. Sumuje wydatki i wyzwala kill switch po
    przekroczeniu limitu z polityki. Tylko odczyt plus zabezpieczenie, bezpieczny cyklicznie.
  module: cost_tracker
  function: check_daily_limit
  interval_seconds: 3600
  enabled: true
- name: knowledge_digest_publisher
  description: Cogodzinny digest "ostatnia aktywność" (zadania z tego tygodnia,
    per konto) do bazy wiedzy Projectly, po jednym wpisie na konto AI (dev/
    marketing/zarzad). Realnie działa (audyt 27.08.2026, 4/4 przebiegów sukces) -
    zapis przez MCP create_knowledge/update_knowledge, publikuje po jednym wpisie
    per rola.
  module: knowledge_digest_publisher
  function: run_knowledge_digest
  interval_seconds: 3600
  enabled: true
- name: notebook_intake
  description: Dodatkowa lokalna sciezka zadan - czyta inbox/zadania.txt (notatnik)
    i przetwarza nowe zadania klientem MOCK (nie rusza zywego Projectly). Wynik i
    decyzje widac w dashboardzie (zakladka Przeplywy). Pusty notatnik = nic nie robi.
  module: notebook_intake
  function: run_once
  interval_seconds: 60
  enabled: true
# Ponizsze skrypty sa WIDOCZNE w dashboardzie, ale domyslnie WYLACZONE
# (enabled: false), bo wykonuja akcje na zewnatrz (tworza zadania, wysylaja
# maile). Uruchom je recznie przyciskiem "Uruchom teraz", zeby zobaczyc co
# zwracaja, a staly harmonogram wlacz dopiero swiadomie (fail-closed).
- name: digest_generator
  description: Digest z Projectly przed daily/weekly (zrobione, przeterminowane, w
    toku). Domyslnie wylaczony, wlacz gdy chcesz codzienny digest.
  module: digest_generator
  function: generate_digest
  interval_seconds: 86400
  enabled: false
- name: source_schema_watcher
  description: Wykrywa zmiane struktury plikow zrodlowych CSV i tworzy zadanie dla
    wlasciciela. Domyslnie wylaczony, bo tworzy zadania.
  module: source_schema_watcher
  function: check_all_watched_sources
  interval_seconds: 3600
  enabled: false
- name: weekly_team_report
  description: Raport tygodniowy zespolu (zrobione, przeterminowane, zalegle wpisy
    czasu). Domyslnie wylaczony, bo moze wysylac kopie mailem.
  module: weekly_team_report
  function: run_weekly_team_report
  interval_seconds: 604800
  enabled: false
- name: mailerlite_report_analyzer
  description: Cotygodniowy raport MailerLite (statystyki, czytelnosc, ocena tonu).
    Domyslnie wylaczony, wymaga klucza MailerLite.
  module: mailerlite_report_analyzer
  function: run_weekly_report
  interval_seconds: 604800
  enabled: false
- name: kacper_monitor
  description: Monitor i samo-naprawa (Kacper, docs/przeplyw.html) - czyta wspolny
    dziennik, wykrywa prace cykliczne i skille zawodzace powtarzalnie, zaklada
    zadanie naprawcze. Domyslnie wylaczony, bo tworzy zadania - wlacz po przejrzeniu
    pierwszych przebiegow (python kacper_monitor.py recznie).
  module: kacper_monitor
  function: run_monitor_cycle
  interval_seconds: 60
  enabled: false
- name: task_feedback_requester
  description: Prosi o feedback po zamknieciu zadania (komentarz, zadanie, mail).
    Domyslnie wylaczony, bo tworzy zadania i wysyla maile.
  module: task_feedback_requester
  function: run_feedback_requests
  interval_seconds: 86400
  enabled: false
# Samo-weryfikacja: uruchamia wszystkie testy dymne i zaznacza w dashboardzie
# czerwony przebieg, gdy cokolwiek sie zepsulo. WLACZONY - to jest mechanizm
# "sprawdzaj czy wszystko dziala" po kazdym dodaniu skilla/funkcji.
- name: self_check
  description: Samo-weryfikacja - uruchamia wszystkie testy dymne (*_smoke_test.py).
    Czerwony przebieg = cos sie zepsulo; klik w przebieg pokazuje ktory test i dlaczego.
  module: self_check
  function: run_self_check
  interval_seconds: 3600
  enabled: true
# Auto-aktualizacja kodu z GitHub. Domyslnie WYLACZONY - wlacz w dashboardzie,
# gdy chcesz, zeby VM sama pobierala nowy kod (po pull self_check zweryfikuje).
- name: repo_update
  description: Pobiera swiezy kod z GitHub (git pull --ff-only). Domyslnie wylaczony
    - wlacz, gdy VM ma sie aktualizowac sama bez klikania aktualizuj-repo.bat.
  module: repo_updater
  function: run_update
  interval_seconds: 1800
  enabled: false
- name: repo_auto_improver
  description: Po zakonczeniu zadania z sygnalem problemu (eskalacja do czlowieka,
    bramka jakosci odrzucila, podwojne wykonanie) analizuje kod w izolowanym git
    worktree i otwiera PR z poprawka albo brakujaca umiejetnoscia. Wlaczony na trwale
    25.08.2026 (decyzja wlasciciela) - tworzy branche/PR-y na GitHubie. Kursor stanu
    (runs/repo_improver_state.json) zresetowany do biezacego max_event_id przed
    wlaczeniem, zeby pierwszy przebieg NIE dzialal retroaktywnie na starym szumie
    testowym (~150 zdarzen z 19-24.08.2026, w tym powtarzajace sie zadanie mock
    "PRJ-0001" i rekordy notebook_intake "NB-*" - test/dev, nie realne incydenty).
    Rola "checker" (29.08.2026, decyzja wlasciciela) - zdolnosc do zmiany repo ma
    byc dostepna WYLACZNIE z osobnego procesu/konta ("AI-Checker" w Projectly),
    nie z procesu dev - odpala go tylko scheduler uruchomiony z BOT_ROLE=checker.
  module: repo_auto_improver
  function: run_repo_improvement_cycle
  interval_seconds: 120
  enabled: true
  role: checker
- name: runner_loop_checker
  description: Ta sama funkcja co job "runner_loop" (runner_loop.run_once) -
    osobny wpis, zeby proces uruchomiony z BOT_ROLE=checker mogl rowniez
    wykonywac wlasne, drobne zadania operacyjne przypisane do konta "AI-Checker"
    w Projectly (nie tylko naprawiac repo) - decyzja wlasciciela 29.08.2026.
    Konto/zakres zadan wynika WYLACZNIE z roli procesu (BOT_ROLE), nie z tego
    wpisu - patrz config/projectly.yaml role_to_account.
  module: runner_loop
  function: run_once
  interval_seconds: 30
  enabled: true
  role: checker
- name: runner_loop_marketing
  description: Ta sama funkcja co job "runner_loop" (runner_loop.run_once) -
    osobny wpis dla WLASNEGO procesu marketingu (BOT_ROLE=marketing,
    start-agent-marketing.bat) - decyzja wlasciciela 29.08.2026. Wczesniej
    zadania konta "AI - Marketing" byly odbierane przy okazji przez proces
    "dev" (poll.extra_accounts w config/projectly.yaml) - od tej daty "AI -
    Marketing" usuniete stamtad, marketing ma wlasny, niezalezny proces.
    Konto/zakres zadan wynika WYLACZNIE z roli procesu (BOT_ROLE), nie z
    tego wpisu - patrz config/projectly.yaml role_to_account.
  module: runner_loop
  function: run_once
  interval_seconds: 30
  enabled: true
  role: marketing
# Domyka petle eskalacja->kontynuacja (escalation.py) - human_response_validator/
# continuation_task_creator istnialy, ale nic ich nie wywolywalo (zywa luka
# znaleziona 29.08.2026). Jeden wpis per rola (jak runner_loop_checker/
# _marketing), zeby kazdy proces pilnowal TYLKO wlasnych eskalacji (WS1).
- name: escalation_watcher
  description: Sprawdza WLASNE eskalacje ("Wymaga decyzji - ...") - rozstrzygniete
    przez czlowieka wracaja do bota jako kontynuacja, otwarte po terminie dostaja
    jedno przypomnienie.
  module: escalation_watcher
  function: run_once
  interval_seconds: 90
  enabled: true
- name: escalation_watcher_checker
  description: Ta sama funkcja co "escalation_watcher" - osobny wpis dla procesu
    checkera (BOT_ROLE=checker), pilnuje WYLACZNIE eskalacji konta "AI-Checker".
  module: escalation_watcher
  function: run_once
  interval_seconds: 90
  enabled: true
  role: checker
- name: escalation_watcher_marketing
  description: Ta sama funkcja co "escalation_watcher" - osobny wpis dla procesu
    marketingu (BOT_ROLE=marketing), pilnuje WYLACZNIE eskalacji konta "AI - Marketing".
  module: escalation_watcher
  function: run_once
  interval_seconds: 90
  enabled: true
  role: marketing
