# Konfiguracja integracji z Projectly przez MCP — "konfiguracja firmy"
# (SKALOWANIE.md sekcja 2), wymieniana przy kopiowaniu do innej firmy.
# projectly_client.py czyta ten plik; sam token/URL NIE tu, tylko w secrets/.env
# (PROJECTLY_API_KEY, PROJECTLY_BASE_URL — patrz .env.example).

# --- Rozpoznawanie kont AI (botów) ---
# Runner bierze zadania przypisane do konta AI swojej roli. Dziś MCP NIE
# wystawia pola "typ konta" (assignees[] to tylko {id, name}) — rozpoznajemy
# konto AI po prefiksie nazwy. Gdy Projectly wystawi w MCP pole typu konta,
# przełącz ai_account.by na "type" i uzupełnij ai_account.type_value.
ai_account:
  by: name_prefix          # name_prefix | type (gdy pojawi się w MCP)
  name_prefix: "AI - "
  type_value: "AI"         # używane dopiero gdy by = type

# Mapa: rola maszyny (config/role.json, bootstrap_register.py) -> nazwa konta
# AI w Projectly. Dev, Marketing, Checker i Zarząd istnieją dziś; reszta to
# plan (ZESPOL-BOTOW.md).
role_to_account:
  dev: "AI - Dev"
  marketing: "AI - Marketing"
  # "Checker" (decyzja właściciela 29.08.2026): osobne konto dla bota, który
  # ma dostęp do repozytorium i może je zmieniać (repo_auto_improver.py) -
  # świadomie ODDZIELONE od dev/marketing, żeby ta zdolność (edycja/nadpisanie
  # repo) nie była dostępna z żadnego innego konta/roli. Nazwa BEZ spacji
  # wokół myślnika ("AI-Checker") — tak dokładnie założone w Projectly,
  # niespójne z resztą ("AI - Dev" itd.), ale to tylko string dopasowywany
  # 1:1 do katalogu osób (_resolve_person_id), nie wzorzec.
  checker: "AI-Checker"
  # "Zarząd" (decyzja właściciela 29.08.2026): własny, niezależny proces —
  # wcześniej konto "AI - Zarząd" było odbierane przy okazji przez proces dev
  # (patrz poniżej poll.extra_accounts, gdzie ten wpis został USUNIĘTY tego
  # samego dnia z tego samego powodu co przy wydzieleniu marketingu).
  zarzad: "AI - Zarząd"
  admin: "AI - Admin"          # planowane
  asystent: "AI - Asystent"    # planowane
  strateg: "AI - Strateg"      # planowane

# Aliasy używane w kodzie (escalation.py, task_router.py) -> realne nazwy osób
# w Projectly. "self" = konto AI tej maszyny (rozwiązywane z role_to_account).
people_aliases:
  pawel: "Paweł"
  bot: "self"
  unassigned_pool: ""          # pusty = bez przypisania (create_task przypisze wg uprawnień tokenu)

# Domyślny człowiek dla eskalacji, gdy routing nie wskaże konkretnej osoby.
escalation_default_assignee: "Paweł"

# --- Zakres pollowania ---
# Runner iteruje projekty i pyta o zadania status=todo przypisane do swojego
# konta AI (filtr assigneeId po stronie serwera). Domyślnie tylko projekty
# aktywne, żeby nie odpytywać zarchiwizowanych/szkiców.
poll:
  project_statuses: ["active"]   # które projekty pollować (status z list_projects)
  task_status: "todo"
  # DODATKOWE konta AI, których zadania bierze proces roli "dev", oprócz
  # własnego konta roli (role_to_account). "AI - Marketing" USUNIĘTE stąd
  # 29.08.2026 (decyzja właściciela): marketing dostał WŁASNY, osobny proces
  # (BOT_ROLE=marketing, start-agent-marketing.bat, job "runner_loop_marketing"
  # w schedule.yaml) — zostawienie go też tutaj groziłoby PODWÓJNYM
  # przetworzeniem tego samego zadania przez dwa niezależne procesy naraz.
  # "AI - Zarząd" USUNIĘTE stąd tego samego dnia, tym samym powodem — zarząd
  # dostał WŁASNY proces (BOT_ROLE=zarzad, start-agent-zarzad.bat, job
  # "runner_loop_zarzad"), patrz role_to_account.zarzad wyżej.
  # Konto wymienione tutaj, a nieistniejące w Projectly, jest zgłaszane w logu
  # (literówka nie może wyglądać jak "brak zadań").
  extra_accounts: []

# Status na żywo per rola (live_status_publisher.py, machine_status_reporter.py,
# kacper_monitor.py, system_health_monitor.py — wszystkie przez
# ProjectlyClient.publish_status). Zobacz PLAN-MONITOROWANIE-AGENTOW-*.md.
#
# transport:
#   "documentation" (domyślny, dziś) — legacy: jedna strona dokumentacji per rola,
#     nadpisywana (project/page_title_template niżej). Zostaw project puste, żeby
#     wyłączyć publikację statusu (tryb tylko-log), bez zmiany transportu.
#   "agent_status_tool" — docelowy: MCP zbot_post_agent_status, jeden nadpisywany
#     wiersz (konto z tokenu, rola=roleLabel) + wpis w historii zdarzeń w Projectly.
#     Przełącz DOPIERO po potwierdzeniu, że narzędzie działa na produkcji
#     (PLAN-MONITOROWANIE-AGENTOW-WIRTUALNY-PRACOWNIK.md sekcja 3/11). Po
#     ustabilizowaniu: usuń transport i project/page_title_template razem z
#     kodem legacy w projectly_client.py._publish_status_via_documentation.
live_status:
  # Potwierdzone na żywo 22.08.2026: post_agent_status działał na produkcji
  # (4 kształty payloadu, patrz PLAN-MONITOROWANIE-AGENTOW-WIRTUALNY-PRACOWNIK.md).
  # 24.08.2026: produkcja wystawiła też prefiksowany zbot_post_agent_status —
  # stara nazwa nadal działa (alias wsteczny), ale kod woła już nową (patrz
  # mcp_tool_usage.status_na_zywo niżej i projectly_client.py).
  transport: "agent_status_tool"
  project: "Administracyjne"
  page_title_template: "Status na żywo — {role}"

# Projekt dla zadań infrastrukturalnych bez naturalnego projektu źródłowego
# (alerty system_health_monitor.py, zadania naprawcze kacper_monitor.py,
# zadanie kontrolne remote_control.py) — create_task w realnym Projectly
# wymaga project_id, a te moduły nie mają zadania źródłowego, z którego by
# je wzięły.
default_admin_project: "Administracyjne"

# Nadpisanie per ROLA (dodane 29.08.2026) — konto "AI-Checker" nie ma dostępu
# do projektu "Administracyjne" w Projectly (inny zakres uprawnień niż dev/
# marketing), tylko do "Usprawnienia". Bez tego wpisu default_admin_project_id()
# zwracałoby None dla roli checker (nazwa nierozpoznana w JEGO katalogu
# projektów) i np. remote_control.py nigdy nie utworzyłby zadania kontrolnego
# dla tej roli. Rola bez wpisu tutaj używa globalnego default_admin_project.
default_admin_project_by_role:
  checker: "Usprawnienia"

# --- Zadania STERUJĄCE botem (remote_control.py) ---
# ID przypięte na stałe (decyzja właściciela 01.09.2026) zamiast szukania po
# tytule i tworzenia brakującego zadania. Powód jest konkretny: zadanie tworzone
# od zera dostaje w Projectly status "todo", a "todo" znaczy WŁĄCZONY — więc
# każde zgubienie/odtworzenie przełącznika cicho WŁĄCZAŁO bota. Realnie zdarzyło
# się 01.09.2026: trzy z czterech botów wróciły na "włączony" po tym, jak
# zostały wyłączone, bo mechanizm założył nowe zadania obok istniejących.
#
# Przypięte ID = zero tworzenia, zero zgadywania po tytule, zero duplikatów.
# Zmiana nazwy zadania w Projectly niczego nie psuje. Gdy ID nie istnieje,
# mechanizm mówi to wprost w logu i NIE startuje bota (fail-closed), zamiast
# zakładać nowe zadanie z domyślnie włączonym statusem.
#
# Klucz = rola (BOT_ROLE), komentarz = konto AI w Projectly (role_to_account).
control_task_by_role:
  dev: "cmtghfuun000gh1592g7qrxo2"        # AI - Dev
  checker: "cmtepuld6000eb0yz0bv2dysq"    # AI-Checker
  marketing: "cmtilfwa40002vr0l92onxb18"  # AI - Marketing
  zarzad: "cmti83mbi002lh159n66tnt3j"     # AI - Zarząd

# --- Mapowanie schematu Projectly -> kontrakt wewnętrzny (get_new_tasks) ---
# risk_level_hint NIE istnieje w Projectly; brak -> runner klasyfikuje jako
# żółte (fail-closed). goal -> expected_result, effect -> acceptance_criteria.
field_mapping:
  task_id: id
  title: title
  expected_result: goal
  acceptance_criteria: effect
  default_risk_level_hint: yellow

# Cogodzinny digest "ostatnia aktywnosc" per konto AI -> baza wiedzy Projectly
# (knowledge_digest_publisher.py). Zapis: MCP create_knowledge/update_knowledge
# (potwierdzone na produkcji 22.08.2026), scope="self" - kazde konto pisze
# wylacznie do wlasnego zakresu. Id utworzonego wpisu per rola trzymane w
# app/runs/knowledge_entry_ids.json (upsert - jeden wpis, nadpisywany, nie
# nowy co godzine; nie ma narzedzia MCP do usuwania wpisow).

# --- Referencja: która funkcja MCP w jakiej sytuacji (zaszyta wiedza) ---
# Nic tego nie parsuje — to mapa dla człowieka i dla agenta pracującego nad
# kodem, spójna z docstringami w skryptach.
mcp_tool_usage:
  # Od ok. 24.08.2026 produkcja wystawia część narzędzi z prefiksem "zbot_"
  # (kompatybilność wsteczna: stare, nieprefiksowane nazwy nadal działają jako
  # alias — potwierdzone żywym wywołaniem, ale traktujemy to jako przejściowe,
  # więc kod już woła nowe nazwy). CRUD zadań/projektów/dokumentacji zostały
  # BEZ prefiksu — tylko narzędzia stricte "botowe" (komentarze, relacje,
  # blokery, status na żywo, baza wiedzy) dostały "zbot_".
  pobierz_nowe_zadania: get_project_tasks        # status=todo, assigneeId=konto AI; get_active_tasks to skrót bez goal/effect/dueDate
  zmien_status:         update_task               # taskId + status (todo|in_progress|done)
  komentarz_dodaj:      zbot_add_task_comment     # główny kanał dialogu z człowiekiem
  komentarze_odczyt:    zbot_get_task_comments    # odczyt decyzji człowieka (human_response_validator)
  utworz_zadanie:       create_task               # projectId + assigneeIds; potem zbot_link_tasks dla powiązania
  powiaz_zadania:       zbot_link_tasks           # ciąg oryginał->eskalacja->kontynuacja (type: eskalacja|kontynuacja|blokuje|duplikat)
  powiazania_odczyt:    zbot_get_task_relations
  feedback_po_zadaniu:  update_task               # feedback + actualHours + completedAt + status=done (samoocena/domknięcie)
  bloker_dodaj:         zbot_add_task_blocker     # bloker zewnętrzny (wolny tekst); bloker=zadanie -> zbot_link_tasks typ "blokuje"
  status_na_zywo:       zbot_post_agent_status    # docelowo (live_status.transport: agent_status_tool); legacy: update_documentation
  raport_tygodniowy:    get_week_report           # completedAt/actualHours/odchylenie estymacji — digest/retro
  baza_wiedzy:          zbot_get_knowledge        # + zbot_get_knowledge_base, zbot_get_knowledge_attachment (nowe, nieużywane jeszcze w kodzie)
