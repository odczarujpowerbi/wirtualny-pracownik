<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wirtualny pracownik - dashboard skryptów</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --line:#e2e5ea; --ink:#1f2430; --muted:#6b7280;
          --ok:#18A558; --err:#E84040; --accent:#2b6cb0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Arial, sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:18px 24px; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:16px; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--muted); font-size:13px; }
  main { padding:24px; max-width:1200px; margin:0 auto; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:28px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:#fafbfc; }
  tr:last-child td { border-bottom:none; }
  .job-name { font-weight:600; }
  textarea { width:100%; min-height:52px; resize:vertical; font:inherit; padding:6px 8px;
             border:1px solid var(--line); border-radius:6px; }
  input[type=number] { width:88px; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.ok { background:#e6f6ee; color:var(--ok); }
  .badge.error { background:#fde8e8; color:var(--err); }
  .badge.none { background:#eceef1; color:var(--muted); }
  .badge.manual { background:#eef2fb; color:var(--accent); }
  .badge.schedule { background:#eceef1; color:var(--muted); }
  button { font:inherit; cursor:pointer; border-radius:6px; border:1px solid var(--line);
           background:#fff; padding:6px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:8px; }
  .switch { display:flex; align-items:center; gap:6px; font-size:13px; }
  .err-cell { color:var(--err); font-size:12px; white-space:pre-wrap; }
  .toast { position:fixed; right:20px; bottom:20px; background:var(--ink); color:#fff;
           padding:10px 16px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s;
           pointer-events:none; max-width:360px; }
  .toast.show { opacity:1; }
  .refreshed { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Dashboard skryptów</h1>
  <span class="sub">Każdy przebieg się odkłada. Harmonogram edytujesz tutaj - scheduler podchwyci zmianę bez restartu.</span>
</header>
<main>
  <h2>Skrypty i harmonogram</h2>
  <div class="card"><table id="jobs">
    <thead><tr>
      <th style="width:22%">Skrypt / opis</th>
      <th style="width:12%">Co ile</th>
      <th style="width:8%">Włączony</th>
      <th style="width:10%">Ostatni</th>
      <th style="width:18%">Ostatni przebieg</th>
      <th style="width:18%">Następny start</th>
      <th style="width:12%">Akcje</th>
    </tr></thead>
    <tbody id="jobs-body"></tbody>
  </table></div>

  <h2>Historia przebiegów <span id="refreshed" class="refreshed"></span></h2>
  <div class="card"><table id="history">
    <thead><tr>
      <th style="width:20%">Kiedy</th>
      <th style="width:22%">Skrypt</th>
      <th style="width:10%">Status</th>
      <th style="width:10%">Trwał</th>
      <th style="width:12%">Źródło</th>
      <th style="width:26%">Błąd</th>
    </tr></thead>
    <tbody id="history-body"></tbody>
  </table></div>
</main>
<div id="toast" class="toast"></div>

<script>
const REFRESH_MS = 10000;
let statusMap = {};
let rowRefs = {}; // nazwa zadania -> komórki statusu, żeby auto-odświeżanie nie kasowało edycji

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node[k] = v;
  }
  for (const c of children) node.appendChild(c);
  return node;
}

function fmt(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("pl-PL");
}

function humanInterval(sec) {
  if (sec % 3600 === 0) return `= ${sec / 3600} h`;
  if (sec % 60 === 0) return `= ${sec / 60} min`;
  return `= ${sec} s`;
}

function badge(status) {
  const cls = status === "ok" ? "ok" : status === "error" ? "error" : "none";
  return el("span", { class: `badge ${cls}`, text: status || "—" });
}

function toast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = isError ? "#E84040" : "#1f2430";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function buildJobRow(job) {
  const s = statusMap[job.name] || {};
  const interval = el("input", { type: "number", min: "1", value: job.interval_seconds });
  const hint = el("div", { class: "hint", text: humanInterval(job.interval_seconds) });
  interval.addEventListener("input", () => {
    const v = parseInt(interval.value, 10);
    hint.textContent = v > 0 ? humanInterval(v) : "podaj sekundy";
  });

  const desc = el("textarea", { value: job.description || "" });
  const enabled = el("input", { type: "checkbox", checked: job.enabled !== false });

  const save = el("button", { class: "primary", text: "Zapisz" });
  save.addEventListener("click", () => saveJob(job.name, interval, enabled, desc, save));
  const run = el("button", { text: "Uruchom teraz" });
  run.addEventListener("click", () => runJob(job.name, run));

  const statusTd = el("td", {}, [badge(s.last_status)]);
  const lastTd = el("td", { text: fmt(s.last_run_at) });
  const nextTd = el("td", { text: fmt(s.next_run_at) });
  rowRefs[job.name] = { statusTd, lastTd, nextTd };

  return el("tr", {}, [
    el("td", {}, [el("div", { class: "job-name", text: job.name }), desc]),
    el("td", {}, [interval, hint]),
    el("td", {}, [el("label", { class: "switch" }, [enabled])]),
    statusTd, lastTd, nextTd,
    el("td", {}, [el("div", { class: "actions" }, [save, run])]),
  ]);
}

function renderJobs(jobs) {
  rowRefs = {};
  const body = document.getElementById("jobs-body");
  body.replaceChildren(...jobs.map(buildJobRow));
}

// Auto-odświeżanie: aktualizuje tylko komórki statusu, nie dotyka pól edycji.
// Jeśli lista zadań się zmieniła (dodano/usunięto), przebudowuje całość.
function updateJobStatuses(jobs) {
  const sameSet = jobs.length === Object.keys(rowRefs).length
    && jobs.every((j) => rowRefs[j.name]);
  if (!sameSet) { renderJobs(jobs); return; }
  for (const job of jobs) {
    const s = statusMap[job.name] || {};
    const ref = rowRefs[job.name];
    ref.statusTd.replaceChildren(badge(s.last_status));
    ref.lastTd.textContent = fmt(s.last_run_at);
    ref.nextTd.textContent = fmt(s.next_run_at);
  }
}

function renderHistory(history) {
  const body = document.getElementById("history-body");
  if (!history.length) {
    body.replaceChildren(el("tr", {}, [el("td", { colSpan: 6, class: "hint", text: "Jeszcze żaden skrypt się nie wykonał." })]));
    return;
  }
  const rows = history.map((h) => el("tr", {}, [
    el("td", { text: fmt(h.run_at) }),
    el("td", { text: h.name }),
    el("td", {}, [badge(h.status)]),
    el("td", { text: h.duration_seconds != null ? h.duration_seconds + " s" : "—" }),
    el("td", {}, [el("span", { class: `badge ${h.trigger === "manual" ? "manual" : "schedule"}`,
                               text: h.trigger === "manual" ? "ręcznie" : "harmonogram" })]),
    el("td", { class: "err-cell", text: h.error || "" }),
  ]));
  body.replaceChildren(...rows);
}

async function saveJob(name, intervalInput, enabledInput, descInput, button) {
  const interval = parseInt(intervalInput.value, 10);
  if (!(interval > 0)) { toast("Interwał musi być dodatnią liczbą sekund.", true); return; }
  button.disabled = true;
  try {
    const res = await fetch("/api/schedule", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, interval_seconds: interval,
                             enabled: enabledInput.checked, description: descInput.value }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error ? json.error.message : "Błąd zapisu");
    applyState(json.data);
    toast(`Zapisano '${name}'.`);
  } catch (e) {
    toast(e.message, true);
  } finally {
    button.disabled = false;
  }
}

async function runJob(name, button) {
  button.disabled = true;
  try {
    const res = await fetch("/api/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error ? json.error.message : "Błąd uruchomienia");
    toast(`Uruchomiono '${name}'. Odświeżam wynik...`);
    setTimeout(load, 1500);
  } catch (e) {
    toast(e.message, true);
  } finally {
    button.disabled = false;
  }
}

function stamp() {
  document.getElementById("refreshed").textContent =
    "(odświeżono " + new Date().toLocaleTimeString("pl-PL") + ")";
}

// Pełne przerysowanie - przy starcie oraz po zapisie/uruchomieniu.
function applyState(state) {
  statusMap = state.status || {};
  renderJobs(state.jobs || []);
  renderHistory(state.history || []);
  stamp();
}

async function load() {
  try {
    const res = await fetch("/api/state");
    applyState(await res.json());
  } catch (e) {
    toast("Nie udało się pobrać stanu: " + e.message, true);
  }
}

// Lekkie odświeżanie w tle - nie rusza pól, które właśnie edytujesz.
async function refresh() {
  try {
    const res = await fetch("/api/state");
    const state = await res.json();
    statusMap = state.status || {};
    updateJobStatuses(state.jobs || []);
    renderHistory(state.history || []);
    stamp();
  } catch (e) {
    // cicho - auto-odświeżanie nie powinno spamować komunikatami
  }
}

load();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
